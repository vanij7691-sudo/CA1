<!DOCTYPE html>
<html>
<head>
    <title>ChatGPT Frontend</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #f5f5f5;
            padding: 15px;
            position: fixed;
            top: 0;
            left: 0;
        }

        .sidebar h2 {
            color: #333333;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            background-color: white;
            border: 1px solid #cccccc;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
        }

        .sidebar p {
            padding: 8px;
            color: #555555;
        }

        /* Main Chat Area */
        .main {
            margin-left: 250px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #eeeeee;
            font-size: 18px;
        }

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .welcome h1 {
            color: #333333;
        }

        .welcome p {
            color: #777777;
        }

        /* Message Box */
        .input-area {
            padding: 20px;
            text-align: center;
        }

        .input-area input {
            width: 70%;
            padding: 15px;
            border: 1px solid #cccccc;
            border-radius: 25px;
            font-size: 15px;
        }

        .input-area button {
            padding: 15px;
            border: none;
            border-radius: 50%;
            background-color: #333333;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>✦ ChatGPT</h2>

        <button>+ New Chat</button>

        <p>Today</p>
        <p>HTML Basics</p>
        <p>CSS Questions</p>
        <p>JavaScript Help</p>

        <br>

        <p>⚙ Settings</p>
        <p>❔ Help</p>
    </div>

    <!-- Main Section -->
    <div class="main">

        <div class="header">
            ChatGPT ▼
        </div>

        <div class="welcome">
            <h1>How can I help you?</h1>
            <p>Ask anything and explore your ideas.</p>
        </div>

        <div class="input-area">
            <input type="text" placeholder="Message ChatGPT...">
            <button>↑</button>
        </div>

    </div>

</body>
</html>
